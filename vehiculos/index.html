<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehículos en venta | Alianza Empresarial</title>
<meta name="description" content="Vehículos revisados con ficha técnica completa. Alianza Empresarial · Tu Inmueble 360.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#1e5c40;--verde-2:#2f7d55;--verde-3:#43a06b;--tinta:#16281d;--tinta-2:#38493f;
  --crema:#f7f4ec;--crema-2:#ede7d7;--lima:#9ac262;--naranja:#e8792f;
  --linea:rgba(30,92,64,.14);
  --serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--crema);color:var(--tinta);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}

.topbar{position:fixed;top:0;left:0;right:0;height:60px;z-index:50;display:flex;align-items:center;gap:12px;padding:0 18px;
  background:rgba(247,244,236,0);backdrop-filter:blur(0);transition:background .4s var(--ease),backdrop-filter .4s var(--ease),box-shadow .4s var(--ease)}
.topbar.solid{background:rgba(247,244,236,.85);backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--linea)}
.topbar .back{background:rgba(255,255,255,.7);border:1px solid var(--linea);width:38px;height:38px;border-radius:50%;
  font-size:20px;cursor:pointer;color:var(--verde);display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none;
  transition:transform .2s var(--spring)}
.topbar .back:active{transform:scale(.88)}
.topbar .tt{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--verde);opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s}
.topbar.solid .tt{opacity:1;transform:translateY(0)}
.topbar .tt small{display:block;font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-2)}
.prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--lima),var(--verde-3));width:0;z-index:52;border-radius:0 3px 3px 0}

.sec-hero{position:relative;padding:96px 22px 26px;overflow:hidden;max-width:900px;margin:0 auto}
.sec-hero .blob{position:absolute;border-radius:50%;filter:blur(40px);z-index:0;will-change:transform}
.sec-hero .blob.a{width:220px;height:220px;background:#bfe0a8;opacity:.5;top:-50px;right:-40px}
.sec-hero .blob.b{width:160px;height:160px;background:#f6c99a;opacity:.4;bottom:-40px;left:-30px}
.sec-hero .inner{position:relative;z-index:1;will-change:transform,opacity}
.sec-hero .eyebrow{font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--naranja);font-weight:800}
.sec-hero h1{font-family:var(--serif);font-size:clamp(30px,8vw,44px);font-weight:600;color:var(--tinta);margin:6px 0 8px;line-height:1.04;letter-spacing:-.015em}
.sec-hero h1 .ln{display:block;overflow:hidden}
.sec-hero h1 .ln span{display:block;will-change:transform}
.sec-hero p{font-size:13.5px;color:var(--tinta-2);max-width:34ch}
.sec-hero .stat{display:flex;gap:22px;margin-top:20px}
.sec-hero .stat b{font-family:var(--serif);font-size:26px;color:var(--verde);font-weight:700;display:block;line-height:1}
.sec-hero .stat span{font-size:9.5px;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

.filtros{display:flex;gap:9px;overflow-x:auto;padding:8px 22px;scrollbar-width:none;max-width:900px;margin:0 auto}
.filtros::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1.4px solid var(--linea);background:#fff;color:var(--tinta-2);
  font-size:12px;font-weight:600;padding:8px 16px;border-radius:18px;cursor:pointer;white-space:nowrap;transition:all .3s var(--ease)}
.chip:active{transform:scale(.93)}
.chip.activo{background:var(--verde);color:#fff;border-color:var(--verde);box-shadow:0 4px 14px rgba(30,92,64,.3)}

.grid{display:grid;grid-template-columns:1fr;gap:14px;padding:16px 22px 60px;max-width:900px;margin:0 auto}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.06);cursor:pointer;
  border:1px solid var(--linea);will-change:transform,opacity}
.card:active{transform:scale(.97)!important}
.card .fw{position:relative;overflow:hidden;height:180px}
.card .foto{width:100%;height:128%;object-fit:cover;display:block;background:#dfe5da;position:absolute;top:-14%;will-change:transform}
.card .pill{position:absolute;top:10px;left:10px;background:rgba(22,40,29,.72);color:#fff;font-size:9.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:11px;backdrop-filter:blur(4px);z-index:2}
.card .body{padding:14px 15px 16px}
.card .precio{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--verde);line-height:1}
.card .nombre{font-size:13.5px;font-weight:600;color:var(--tinta);margin:5px 0 2px;line-height:1.2}
.card .ubi{font-size:11px;color:var(--tinta-2)}
.card .mini{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--linea);font-size:10.5px;color:var(--tinta-2);flex-wrap:wrap}

.detalle{position:fixed;inset:0;background:var(--crema);z-index:60;display:flex;flex-direction:column;
  transform:translateY(100%);will-change:transform;pointer-events:none}
.detalle.on{pointer-events:auto}
.det-close{position:absolute;top:16px;left:16px;z-index:12;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);
  border:1px solid var(--linea);width:40px;height:40px;border-radius:50%;font-size:21px;color:var(--tinta);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .2s var(--spring)}
.det-close:active{transform:scale(.85)}
.det-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
.det-scroll::-webkit-scrollbar{display:none}
.det-inner{max-width:600px;margin:0 auto}
.galeria{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:300px;background:#cdd3c8}
.galeria::-webkit-scrollbar{display:none}
.galeria .slide{flex:0 0 100%;scroll-snap-align:center;height:100%;overflow:hidden;position:relative}
.galeria .slide img{width:118%;height:100%;object-fit:cover;display:block;position:absolute;left:-9%;will-change:transform}
.gal-dots{display:flex;gap:6px;justify-content:center;margin-top:-26px;position:relative;z-index:5}
.gal-dots .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);transition:all .35s var(--ease)}
.gal-dots .dot.on{background:#fff;width:22px;border-radius:4px}
.det-body{padding:24px 22px 60px}
.det-badge{display:inline-block;background:var(--naranja);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:5px 13px;border-radius:14px;margin-bottom:13px}
.det-precio{font-family:var(--serif);font-size:33px;font-weight:700;color:var(--verde);line-height:1}
.det-nombre{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--tinta);margin:9px 0 4px}
.det-ubi{font-size:12.5px;color:var(--tinta-2);margin-bottom:22px;line-height:1.45}
.det-sub{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--tinta);margin:8px 0 12px}
.ficha-tec{width:100%;border-collapse:collapse;border-radius:14px;overflow:hidden;border:1px solid var(--linea);margin-bottom:26px}
.ficha-tec tr:nth-child(odd){background:#fff}.ficha-tec tr:nth-child(even){background:var(--crema-2)}
.ficha-tec td{padding:12px 15px;font-size:13px}
.ficha-tec td.k{font-weight:700;color:var(--verde);width:44%;text-transform:uppercase;font-size:10.5px;letter-spacing:.05em}
.ficha-tec td.v{color:var(--tinta);font-weight:600;font-family:var(--serif);font-size:14.5px}
.cta{display:block;width:100%;text-align:center;text-decoration:none;color:#fff;border:none;padding:16px;border-radius:14px;
  font-family:var(--sans);font-weight:700;font-size:14px;letter-spacing:.03em;cursor:pointer;margin-bottom:11px;transition:transform .2s var(--spring)}
.cta:active{transform:scale(.97)}
.cta.wpp{background:#1fa855;box-shadow:0 8px 20px rgba(31,168,85,.3)}
.det-nota{font-size:10.5px;color:var(--tinta-2);text-align:center;margin-top:6px;opacity:.8}
</style>
</head>
<body>

<div class="prog" id="prog"></div>
<div class="topbar" id="topbar">
  <a class="back" href="../index.html" title="Volver al inicio">‹</a>
  <div class="tt">Vehículos<small>Alianza Empresarial</small></div>
</div>

<div class="sec-hero">
  <div class="blob a" data-speed="0.4"></div><div class="blob b" data-speed="0.7"></div>
  <div class="inner">
    <div class="eyebrow">Vehículos revisados</div>
    <h1><span class="ln"><span>Carros</span></span><span class="ln"><span>disponibles</span></span></h1>
    <p>Con ficha técnica completa. Pregunta por opciones de pago y permuta.</p>
    <div class="stat">
      <div><b data-count="8">0</b><span>Disponibles</span></div>
    </div>
  </div>
</div>

<div class="filtros" id="filtros"></div>
<div class="grid" id="grid"></div>

<div class="detalle" id="detalle">
  <button class="det-close" onclick="cerrarDet()">✕</button>
  <div class="det-scroll"><div class="det-inner" id="det-contenido"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
/* ============================================================
   DATOS — para agregar un vehículo, copia un bloque y edítalo.
   Las fotos van en img/ con el nombre <id>-1.jpg, <id>-2.jpg...
   Fuente: ficha técnica de cada vehículo (marca, línea, modelo,
   tipo, color, cilindrada, combustible, kilometraje, valor).
   NUNCA se publica la tarjeta de propiedad ni otro dato sensible.
   ============================================================ */
const WHATSAPP = "57XXXXXXXXXX"; // <-- PENDIENTE: número real de WhatsApp
const VEHICULOS = [
  {
    id:"bmw", tipo:"Automóvil", marca:"BMW",
    nombre:"BMW 740i", precioCorto:"$70.000.000", precio:"$70.000.000",
    resumen:"2008 · Gasolina · 130.604 km", fotos:4,
    ficha:{"Marca":"BMW","Línea":"740i","Modelo":"2008","Tipo":"Automóvil","Color":"Gris Titán Metalizado","Cilindrada":"4.0","Combustible":"Gasolina","Kilometraje":"130.564 km"}
  },
  {
    id:"foton", tipo:"Camioneta", marca:"Foton",
    nombre:"Foton BJ2037Y3MDV", precioCorto:"$88.000.000", precio:"$88.000.000",
    resumen:"2020 · Diésel · 120.184 km", fotos:3,
    ficha:{"Marca":"Foton","Línea":"BJ2037Y3MDV","Modelo":"2020","Tipo":"Camioneta","Color":"Gris","Cilindrada":"2.776","Combustible":"Diésel","Kilometraje":"120.184 km"}
  },
  {
    id:"kia-sportage", tipo:"Camioneta", marca:"Kia",
    nombre:"Kia New Sportage LX", precioCorto:"$45.000.000", precio:"$45.000.000",
    resumen:"2011 · Gasolina · 190.604 km", fotos:4,
    ficha:{"Marca":"Kia","Línea":"New Sportage LX","Modelo":"2011","Tipo":"Camioneta","Color":"Gris","Cilindrada":"1.975","Combustible":"Gasolina","Kilometraje":"190.604 km"}
  },
  {
    id:"nissan", tipo:"Camioneta", marca:"Nissan",
    nombre:"Nissan D22 / NP300", precioCorto:"$60.000.000", precio:"$60.000.000",
    resumen:"2013 · Diésel · 157.698 km", fotos:3,
    ficha:{"Marca":"Nissan","Línea":"D22 / NP300","Modelo":"2013","Tipo":"Camioneta","Color":"Negro","Cilindrada":"2.488","Combustible":"Diésel","Kilometraje":"157.698 km"}
  },
  {
    id:"renault-clio", tipo:"Automóvil", marca:"Renault",
    nombre:"Renault Clio", precioCorto:"$12.000.000", precio:"$12.000.000",
    resumen:"1997 · Gasolina · 273.531 km", fotos:3,
    ficha:{"Marca":"Renault","Línea":"Clio","Modelo":"1997","Tipo":"Automóvil","Color":"Rojo Dínamo Perlado","Cilindrada":"1.400","Combustible":"Gasolina","Kilometraje":"273.531 km"}
  },
  {
    id:"ssangyong", tipo:"Campero", marca:"SsangYong",
    nombre:"SsangYong Rexton", precioCorto:"$175.000.000", precio:"$175.000.000",
    resumen:"2024 · Diésel · 18.355 km", fotos:4,
    ficha:{"Marca":"SsangYong","Línea":"Rexton","Modelo":"2024","Tipo":"Campero","Color":"Gris Elemental","Cilindrada":"2.157","Combustible":"Diésel","Kilometraje":"18.355 km"}
  },
  {
    id:"volkswagen-jetta", tipo:"Automóvil", marca:"Volkswagen",
    nombre:"Volkswagen Jetta Trendline", precioCorto:"$36.000.000", precio:"$36.000.000",
    resumen:"2015 · Gasolina · 86.690 km", fotos:3,
    ficha:{"Marca":"Volkswagen","Línea":"Jetta Trendline","Modelo":"2015","Tipo":"Automóvil","Color":"Negro Profundo Perlado","Cilindrada":"1.984","Combustible":"Gasolina","Kilometraje":"86.690 km"}
  },
  {
    id:"volkswagen-saveiro", tipo:"Camioneta", marca:"Volkswagen",
    nombre:"Volkswagen Saveiro", precioCorto:"$42.000.000", precio:"$42.000.000",
    resumen:"2019 · Gasolina · 61.079 km", fotos:3,
    ficha:{"Marca":"Volkswagen","Línea":"Saveiro","Modelo":"2019","Tipo":"Camioneta","Color":"Plata Sirius Metálico","Cilindrada":"1.6","Combustible":"Gasolina","Kilometraje":"61.079 km"}
  }
];

/* ---- Filtros por tipo ---- */
const tipos = ["Todos", ...new Set(VEHICULOS.map(v=>v.tipo))];
const filtrosEl = document.getElementById('filtros');
tipos.forEach((t,i)=>{
  const b=document.createElement('div');
  b.className='chip'+(i===0?' activo':'');
  b.textContent=t; b.onclick=()=>filtrar(t,b);
  filtrosEl.appendChild(b);
});
function filtrar(tipo, btn){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('activo'));
  btn.classList.add('activo');
  pintar(tipo==='Todos'?VEHICULOS:VEHICULOS.filter(v=>v.tipo===tipo));
}

/* ---- Pintar tarjetas ---- */
const grid=document.getElementById('grid');
function pintar(lista){
  grid.innerHTML='';
  lista.forEach(v=>{
    const card=document.createElement('div');
    card.className='card';
    card.onclick=()=>verDetalle(v.id);
    card.innerHTML=`
      <div class="fw"><img class="foto" src="img/${v.id}-1.jpg" alt="${v.nombre}"><div class="pill">${v.tipo}</div></div>
      <div class="body">
        <div class="precio">${v.precioCorto}</div>
        <div class="nombre">${v.nombre}</div>
        <div class="ubi">${v.resumen}</div>
      </div>`;
    grid.appendChild(card);
  });
  animarCards();
}

/* ---- Detalle ---- */
function verDetalle(id){
  const v=VEHICULOS.find(x=>x.id===id);
  const slides=[];
  for(let i=1;i<=v.fotos;i++) slides.push(`<div class="slide"><img src="img/${v.id}-${i}.jpg" alt="${v.nombre} ${i}"></div>`);
  const filas=Object.entries(v.ficha).map(([k,val])=>`<tr><td class="k">${k}</td><td class="v">${val}</td></tr>`).join('');
  const msg=encodeURIComponent(`Hola, me interesa el ${v.nombre} (${v.precio}). ¿Me dan más información?`);
  document.getElementById('det-contenido').innerHTML=`
    <div class="galeria" id="gal">${slides.join('')}</div>
    <div class="gal-dots" id="galdots"></div>
    <div class="det-body">
      <div class="det-badge dr">Se vende</div>
      <div class="det-precio dr">${v.precio}</div>
      <div class="det-nombre dr">${v.nombre}</div>
      <div class="det-ubi dr">🚗 ${v.tipo} · Modelo ${v.ficha["Modelo"]}</div>
      <div class="det-sub dr">Ficha técnica</div>
      <table class="ficha-tec">${filas}</table>
      <a class="cta wpp" href="https://wa.me/${WHATSAPP}?text=${msg}">💬 Preguntar por este vehículo</a>
      <div class="det-nota">Un asesor te responde el mismo día</div>
    </div>`;
  abrirDet();
}

/* ============================================================
   ANIMACIONES (GSAP) — mismo patrón que Propiedades
   ============================================================ */
gsap.registerPlugin(ScrollTrigger);
const topbar=document.getElementById('topbar');
const prog=document.getElementById('prog');
addEventListener('scroll',()=>{
  const y=scrollY, max=document.body.scrollHeight-innerHeight;
  topbar.classList.toggle('solid', y>40);
  prog.style.width=(max>0?y/max*100:0)+'%';
});
gsap.from('.sec-hero h1 .ln span',{yPercent:120,duration:.9,ease:'power4.out',stagger:.12,delay:.1});
gsap.from('.sec-hero .eyebrow, .sec-hero p, .sec-hero .stat',{y:20,opacity:0,duration:.7,ease:'power3.out',stagger:.08,delay:.3});
document.querySelectorAll('[data-count]').forEach(el=>{const o={v:0};gsap.to(o,{v:+el.dataset.count,duration:1.1,delay:.5,ease:'power2.out',onUpdate:()=>el.textContent=Math.round(o.v)})});
gsap.utils.toArray('.sec-hero .blob').forEach(b=>gsap.to(b,{y:200*(+b.dataset.speed),ease:'none',scrollTrigger:{trigger:'.sec-hero',start:'top top',end:'bottom top',scrub:true}}));
gsap.to('.sec-hero .inner',{y:80,opacity:0,ease:'none',scrollTrigger:{trigger:'.sec-hero',start:'top top',end:'bottom top',scrub:true}});
function animarCards(){
  gsap.from('.card',{y:60,opacity:0,scale:.94,duration:.7,ease:'power3.out',stagger:.09,scrollTrigger:{trigger:'.grid',start:'top 90%'}});
  gsap.utils.toArray('.card .foto').forEach(img=>gsap.fromTo(img,{yPercent:-8},{yPercent:8,ease:'none',scrollTrigger:{trigger:img.closest('.card'),start:'top bottom',end:'bottom top',scrub:true}}));
}
function initGaleria(){
  const gal=document.getElementById('gal'), dotsC=document.getElementById('galdots');
  const slides=[...gal.querySelectorAll('.slide')];
  dotsC.innerHTML='';
  slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' on':'');dotsC.appendChild(d)});
  gal.onscroll=()=>{
    const idx=Math.round(gal.scrollLeft/gal.clientWidth);
    dotsC.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===idx));
    slides.forEach((s,i)=>{const img=s.querySelector('img');const rel=(gal.scrollLeft-i*gal.clientWidth)/gal.clientWidth;gsap.set(img,{xPercent:rel*10})});
  };
}
const det=document.getElementById('detalle');
function abrirDet(){
  det.classList.add('on');
  initGaleria();
  gsap.fromTo(det,{yPercent:100},{yPercent:0,duration:.6,ease:'power4.out',onComplete:()=>{
    gsap.from(det.querySelectorAll('.dr'),{y:24,opacity:0,duration:.6,ease:'power3.out',stagger:.07});
    gsap.from(det.querySelectorAll('.ficha-tec tr'),{x:-16,opacity:0,duration:.4,ease:'power2.out',stagger:.05,delay:.15});
    gsap.from(det.querySelectorAll('.galeria .slide img'),{scale:1.12,duration:1.1,ease:'power2.out'});
  }});
  document.body.style.overflow='hidden';
}
function cerrarDet(){
  gsap.to(det,{yPercent:100,duration:.45,ease:'power3.in',onComplete:()=>{det.classList.remove('on');gsap.set(det,{yPercent:100});document.body.style.overflow=''}});
}

pintar(VEHICULOS);
</script>
</body>
</html>
